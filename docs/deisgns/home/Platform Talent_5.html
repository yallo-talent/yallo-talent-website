<!-- YALLO TALENT — PLATFORM TALENT SECTION | Swiper Coverflow | Lato Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

<style>
/* ═══════════════════════════════════════════════════════
   PLATFORM TALENT — scoped to #pltSection
════════════════════════════════════════════════════════ */

#pltSection *,
#pltSection *::before,
#pltSection *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Lato', system-ui, sans-serif !important;
}

/* ── Section shell
   Background: YALLO deep-navy gradient (matches How It Works)
   Pattern B-large (gold fine grid) + Pattern C (corner glow)   */
#pltSection {
  /* YALLO gradient base */
  background-color: #060c18;
  background-image:
    /* Pattern C — corner gold glow (bottom-left) */
    radial-gradient(ellipse 70% 60% at 0% 100%,  rgba(212,168,67,.14) 0%, transparent 55%),
    /* Pattern C — soft top-right accent */
    radial-gradient(ellipse 50% 50% at 100% 0%,  rgba(212,168,67,.07) 0%, transparent 55%),
    /* Pattern B-large — YALLO gold fine grid 44px */
    linear-gradient(rgba(212,168,67,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212,168,67,.025) 1px, transparent 1px);
  background-size:
    100% 100%,
    100% 100%,
    44px 44px,
    44px 44px;
  -webkit-font-smoothing: antialiased;
  padding: clamp(56px, 8vw, 100px) 0 !important;
  position: relative;
  overflow: hidden;
  width: 100%;
}

/* Constellation canvas */
#pltCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* ── Content wrapper */
.plt-wrap {
  width: 100% !important;
  max-width: 1400px !important;
  margin: 0 auto !important;
  padding-left: 48px !important;
  padding-right: 48px !important;
  position: relative;
  z-index: 1;
}
@media (max-width: 768px) {
  .plt-wrap { padding-left: 24px !important; padding-right: 24px !important; }
}
@media (max-width: 480px) {
  .plt-wrap { padding-left: 16px !important; padding-right: 16px !important; }
}

/* ── Header */
.plt-header-row {
  margin-bottom: clamp(36px, 5vw, 56px) !important;
}
.plt-eyebrow {
  display: block;
  font-size: 11px !important;
  font-weight: 700 !important;
  letter-spacing: .22em !important;
  text-transform: uppercase !important;
  color: #D4A843 !important;
  margin-bottom: 16px !important;
}
.plt-heading {
  font-size: 45px !important;
  font-weight: 900 !important;
  color: #fff !important;
  letter-spacing: -.03em !important;
  line-height: 1.05 !important;
  max-width: 700px;
  margin-bottom: 16px !important;
}
.plt-subtext {
  font-size: clamp(14px, 1.4vw, 16px) !important;
  font-weight: 300 !important;
  line-height: 1.72 !important;
  color: #A8A8A8 !important;
  max-width: 480px;
}

/* ═══════════════════════════════════════════════════════
   SWIPER SHELL — edge fades match new gradient bg
════════════════════════════════════════════════════════ */
.plt-swiper-shell {
  width: 100%;
  position: relative;
  z-index: 1;
}
.plt-swiper-shell::before,
.plt-swiper-shell::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  width: clamp(32px, 7vw, 100px);
  z-index: 10;
  pointer-events: none;
}
.plt-swiper-shell::before {
  left: 0;
  /* fade matches section left-corner glow colour */
  background: linear-gradient(to right, #060c18 0%, transparent 100%);
}
.plt-swiper-shell::after {
  right: 0;
  background: linear-gradient(to left, #060c18 0%, transparent 100%);
}

.plt-swiper {
  width: 100%;
  padding: 28px 0 52px !important;
  overflow: visible !important;
}
.plt-swiper .swiper-slide {
  width: 320px;
  height: auto;
  opacity: .44;
  transition: opacity .45s ease;
}
.plt-swiper .swiper-slide-active        { opacity: 1; }
.plt-swiper .swiper-slide-prev,
.plt-swiper .swiper-slide-next          { opacity: .70; }

/* ═══════════════════════════════════════════════════════
   MANUAL NAVIGATION — premium circular buttons
   Glassmorphism + thin gold border, stacked vertically,
   right side of carousel (matches Latest Insights)
════════════════════════════════════════════════════════ */
.plt-nav {
  position: absolute;
  right: clamp(16px, 3.5vw, 48px);
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 12px;
  z-index: 20;                          /* above the edge fade (z-10) */
}
.plt-nav-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1px solid rgba(212,168,67,.4);
  background: rgba(13,21,38,.55);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: border-color .25s ease, background .25s ease,
              box-shadow .25s ease, transform .15s ease;
  box-shadow: 0 4px 20px rgba(0,0,0,.35);
  padding: 0 !important;
}
.plt-nav-btn svg {
  width: 18px;
  height: 18px;
  stroke: #D4A843;
  stroke-width: 2;
  fill: none;
  display: block;
  transition: transform .2s ease;
}
.plt-nav-btn:hover {
  border-color: rgba(212,168,67,.85);
  background: rgba(212,168,67,.12);
  box-shadow: 0 6px 28px rgba(0,0,0,.45), 0 0 22px rgba(212,168,67,.14);
}
.plt-nav-btn:hover svg      { transform: scale(1.12); }
.plt-nav-btn:active         { transform: scale(.94); }
.plt-nav-btn:focus-visible {
  outline: 2px solid #D4A843;
  outline-offset: 3px;
}
@media (max-width: 768px) {
  .plt-nav { right: 12px; gap: 8px; }
  .plt-nav-btn { width: 40px; height: 40px; }
  .plt-nav-btn svg { width: 15px; height: 15px; }
}

/* ═══════════════════════════════════════════════════════
   PLATFORM CARD
════════════════════════════════════════════════════════ */
.plt-card {
  background: #0d1526;                  /* navy-tinted card surface */
  border: 1px solid rgba(212,168,67,.1);
  border-radius: 20px;
  padding: 28px 26px 24px !important;
  height: 295px;
  display: flex;
  flex-direction: column;
  gap: 0;
  position: relative;
  overflow: hidden;
  cursor: default;
  box-shadow:
    0 4px 24px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.04);
  transition: border-color .3s ease, box-shadow .3s ease;
}
.plt-card::before {
  content: '';
  position: absolute;
  top: -60px; left: -60px;
  width: 220px; height: 220px;
  border-radius: 50%;
  background: radial-gradient(circle,
    var(--card-glow, rgba(212,168,67,.06)) 0%, transparent 70%);
  pointer-events: none;
}
.swiper-slide-active .plt-card {
  border-color: rgba(212,168,67,.45);
  box-shadow:
    0 8px 48px rgba(0,0,0,.6),
    0 0 0 1px rgba(212,168,67,.18),
    0 0 36px rgba(212,168,67,.1),
    inset 0 1px 0 rgba(255,255,255,.06);
}

/* ── Card top */
.plt-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px !important;
}

/* Badge = fixed viewport for the icon (+19% vs previous 32px).
   Each icon is individually scaled via --plt-icon-h for equal
   optical weight; the badge itself never resizes per icon. */
.plt-badge {
  background: rgba(212,168,67,.12);
  border: 1px solid rgba(212,168,67,.28);
  border-radius: 8px;
  padding: 0 10px !important;
  height: 42px;
  min-width: 42px;
  display: flex;
  align-items: center;      /* perfect vertical centring   */
  justify-content: center;  /* perfect horizontal centring */
  /* fallback text styling (only if an icon is missing) */
  font-size: 11px !important;
  font-weight: 700 !important;
  letter-spacing: .1em !important;
  color: #D4A843 !important;
  text-transform: uppercase;
}
.plt-logo {
  height: var(--plt-icon-h, 18px);  /* per-icon optical height */
  width: auto;
  max-width: 46px;      /* wide marks never touch the edges */
  max-height: 30px;     /* 6px min clearance top+bottom     */
  object-fit: contain;  /* aspect ratio always preserved    */
  display: block;
}

.plt-arrow {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.12);
  display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,.35);
  font-size: 16px !important;
  transition: border-color .2s, color .2s, background .2s;
  flex-shrink: 0;
  cursor: pointer;
}
.swiper-slide-active .plt-arrow {
  border-color: rgba(212,168,67,.45);
  color: #D4A843;
}
.plt-card:hover .plt-arrow {
  border-color: rgba(212,168,67,.65);
  color: #D4A843;
  background: rgba(212,168,67,.1);
}

/* ── Platform name */
.plt-name {
  font-size: clamp(22px, 2.8vw, 28px) !important;
  font-weight: 900 !important;
  color: #fff !important;
  letter-spacing: -.02em !important;
  line-height: 1.1;
  margin-bottom: 10px !important;
}

/* ── Description */
.plt-desc {
  font-size: 13.5px !important;
  font-weight: 300 !important;
  line-height: 1.68 !important;
  color: #A8A8A8 !important;
  flex: 1;
}

/* ── Tags */
.plt-tags {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-top: 16px !important;
}
.plt-tag {
  background: rgba(212,168,67,.06);
  border: 1px solid rgba(212,168,67,.15);
  border-radius: 99px;
  padding: 4px 11px !important;
  font-size: 10px !important;
  font-weight: 700 !important;
  letter-spacing: .06em !important;
  color: rgba(212,168,67,.75) !important;
  text-transform: uppercase;
  white-space: nowrap;
}

/* ── Pagination */
.plt-swiper .swiper-pagination-bullet {
  background: rgba(212,168,67,.25) !important;
  opacity: 1 !important; width: 6px !important; height: 6px !important;
}
.plt-swiper .swiper-pagination-bullet-active {
  background: #D4A843 !important;
  width: 18px !important; border-radius: 3px !important;
}

/* ═══════════════════════════════════════════════════════
   RESPONSIVE
════════════════════════════════════════════════════════ */
@media (max-width: 1440px) {
  .plt-swiper .swiper-slide { width: 300px; }
}
@media (max-width: 1024px) {
  .plt-heading { font-size: clamp(28px, 5vw, 42px) !important; max-width: 100%; }
  .plt-subtext { max-width: 100%; }
  .plt-swiper .swiper-slide { width: 290px; }
  .plt-card { height: 280px; }
}
@media (max-width: 768px) {
  .plt-swiper .swiper-slide { width: 275px; }
  .plt-card { height: 275px; padding: 24px 22px 20px !important; }
  .plt-name { font-size: 22px !important; }
  .plt-desc { font-size: 13px !important; }
  .plt-badge { height: 38px; min-width: 38px; padding: 0 9px !important; }
  .plt-logo { height: calc(var(--plt-icon-h, 18px) * .9); max-width: 41px; max-height: 27px; }
}
@media (max-width: 480px) {
  .plt-swiper .swiper-slide { width: 250px; }
  .plt-card { height: 265px; padding: 20px 18px 18px !important; }
  .plt-name  { font-size: 20px !important; }
  .plt-badge { font-size: 10px !important; height: 34px; min-width: 34px; padding: 0 8px !important; }
  .plt-desc  { font-size: 12.5px !important; }
  .plt-tag   { font-size: 9.5px !important; }
  .plt-logo  { height: calc(var(--plt-icon-h, 18px) * .82); max-width: 36px; max-height: 24px; }
}
</style>

<!-- ── MARKUP ──────────────────────────────────── -->
<section id="pltSection">

  <canvas id="pltCanvas"></canvas>

  <div class="plt-wrap">
    <div class="plt-header-row">
      <span class="plt-eyebrow">Platform Talent</span>
      <h2 class="plt-heading">Specialists in the platforms you run.</h2>
      <p class="plt-subtext">Deep benches across the enterprise stack — functional, technical and architecture.</p>
    </div>
  </div>

  <div class="plt-swiper-shell">
    <div class="swiper plt-swiper" id="pltSwiper">
      <div class="swiper-wrapper" id="pltWrapper"></div>
      <div class="swiper-pagination"></div>
    </div>

    <!-- Manual navigation — controls the existing Swiper instance -->
    <div class="plt-nav">
      <button type="button" class="plt-nav-btn" id="pltNavPrev" aria-label="Previous slide">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 5 8 12 15 19"/></svg>

        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 5 16 12 9 19"/></svg>
      </button>
    </div>
  </div>

</section>

  /* ──────────────────────────────────────────────────────────
     ELEMENTOR-SAFE INIT
     Elementor renders HTML widgets after the page loads and
     CDN scripts can arrive late. This function polls until
     Swiper is available, then initialises once — no matter
     how Elementor sequences the render.
  ────────────────────────────────────────────────────────── */
  function initPlatformSwiper() {
    /* If Swiper isn't loaded yet, try again in 80ms */
    if (typeof Swiper === 'undefined') {
      setTimeout(initPlatformSwiper, 80);
      return;
    }

    /* Guard: don't double-init */
    var container = document.getElementById('pltSwiper');
    if (!container || container.swiper) return;

    var sw = new Swiper('#pltSwiper', {

      centeredSlides: true,

      loop:           true,

      coverflowEffect: {

        stretch:      20,
        depth:        180,
        modifier:     1,
        slideShadows: false
      },

              var slide = e.target.closest('.swiper-slide');
              if (!slide) return;
              var idx = parseInt(

              );

  /* ── CONSTELLATION CANVAS ── */
  ((() => {

      canvas.width  = sec.offsetWidth;
      canvas.height = sec.offsetHeight;
      build();
    }
    function build() {
      dots = [];
      for (var i = 0; i < N; i++) {
        dots.push({
          x:  Math.random() * canvas.width,
          y:  Math.random() * canvas.height,
          r:  Math.random() * 1.4 + 0.4,
          vx: (Math.random() - 0.5) * 0.22,
          vy: (Math.random() - 0.5) * 0.22
        });
      }
    }
    function rgba(a) {
      return 'rgba(' + GOLD[0] + ',' + GOLD[1] + ',' + GOLD[2] + ',' + a + ')';
    }
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (var i = 0; i < dots.length; i++) {
        for (var j = i + 1; j < dots.length; j++) {
          var dx = dots[i].x - dots[j].x;
          var dy = dots[i].y - dots[j].y;
          var d  = Math.sqrt(dx * dx + dy * dy);
          if (d < 160) {
            ctx.beginPath();
            ctx.strokeStyle = rgba(0.07 * (1 - d / 160));
            ctx.lineWidth   = 0.6;
            ctx.moveTo(dots[i].x, dots[i].y);
            ctx.lineTo(dots[j].x, dots[j].y);
            ctx.stroke();
          }
        }
      }
      dots.forEach((d) => {
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fillStyle = rgba(0.45);
        ctx.fill();
        d.x += d.vx; d.y += d.vy;
        if (d.x < 0 || d.x > canvas.width)  d.vx *= -1;
        if (d.y < 0 || d.y > canvas.height) d.vy *= -1;
      });
      requestAnimationFrame(draw);
    }
    resize();
    draw();
    var t;
    window.addEventListener('resize', () => {
      clearTimeout(t); t = setTimeout(resize, 200);
    });
  })());

})());
</script>
