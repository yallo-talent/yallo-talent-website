<!--
  YALLO TALENT — INSIGHTS  |  Horizontal image card scroll
  Reference: Latest Insights card carousel (image cards)
  Gradient card backgrounds · Horizontal snap scroll · Nav buttons
  Fade masks · Hover scale · Lato · YALLO navy bg

  ★ CARDS ARE NOW CONFIG-DRIVEN — edit the CARDS array at the
    top of the <script> below. Each card supports:
      image: ''  → gradient background (current look)
      image: 'https://…/photo.jpg' → photo background
      url:   ''  → card is not clickable
      url:   '/insights/my-post'   → whole card links there
      newTab: true → opens the link in a new tab (optional)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

<section id="insSec">
<style>
/* ═══════════════════════════════════════════════════
   TOKENS
═══════════════════════════════════════════════════ */
#insSec {
  --g:   #D4A843;
  --gl:  #F0C866;
  --w:   #FFFFFF;
  --mu:  #A0A0A0;
  --bg:  #060c18;
  --eas: cubic-bezier(.22,.61,.36,1);

  background-color: var(--bg);
  background-image:
    linear-gradient(rgba(212,168,67,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212,168,67,.018) 1px, transparent 1px);
  background-size: 44px 44px;

  padding: clamp(72px,9vw,120px) 0;
  position: relative; overflow: hidden;
  font-family: 'Lato', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
#insSec *, #insSec *::before, #insSec *::after {
  box-sizing: border-box;
  font-family: 'Lato', system-ui, sans-serif !important;
}
#insSec a { color: inherit; text-decoration: none; }

/* ── WRAPPER ─────────────────────────────────────── */
.ins-wrap {
  max-width: 1400px;
  margin: 0 auto;
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  gap: clamp(36px,5vw,52px);
}

/* ═══════════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════════ */
.ins-hdr {
  display: flex; align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  padding: 0 clamp(20px,5vw,64px);
}
.ins-hdr-l { display: flex; flex-direction: column; gap: 0; }

.ins-eye {
  display: inline-flex; align-items: center; gap: 9px;
  font-size: 10.5px !important; font-weight: 700 !important;
  letter-spacing: .24em !important; text-transform: uppercase;
  color: var(--g); margin-bottom: 14px;
}
.ins-eye-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--g); box-shadow: 0 0 8px rgba(212,168,67,.7);
  animation: insDot 2.4s ease-in-out infinite;
}
@keyframes insDot {
  0%,100% { box-shadow: 0 0 0 0   rgba(212,168,67,.55); }
  50%      { box-shadow: 0 0 0 8px rgba(212,168,67,  0); }
}

#insSec .ins-h2 {
  font-size: clamp(28px,4vw,50px) !important;
  font-weight: 900 !important; letter-spacing: -.03em !important;
  line-height: 1.04; color: var(--w) !important;
  margin: 0 !important; padding: 0 !important;
}

/* Header right */
.ins-hdr-r { display: flex; align-items: center; gap: 12px; }

.ins-nav-btn {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid rgba(212,168,67,.3);
  background: rgba(6,12,24,.8);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  color: var(--w); font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .22s, background .22s, transform .18s;
  outline: none; flex-shrink: 0;
}
.ins-nav-btn:hover {
  border-color: var(--g);
  background: rgba(212,168,67,.1);
  transform: scale(1.08);
}

.ins-view-all {
  font-size: 13px !important; font-weight: 700 !important;
  color: var(--mu) !important; letter-spacing: .04em;
  transition: color .2s;
}
.ins-view-all:hover { color: var(--g) !important; }

/* ═══════════════════════════════════════════════════
   SCROLL STAGE
═══════════════════════════════════════════════════ */
.ins-stage {
  position: relative;
}

/* Left/right fade masks matching section bg */
.ins-stage::before,
.ins-stage::after {
  content: '';
  position: absolute; top: 0; bottom: 0;
  width: clamp(30px,5vw,80px);
  z-index: 10; pointer-events: none;
}
.ins-stage::before {
  left: 0;
  background: linear-gradient(to right, var(--bg) 0%, transparent 100%);
}
.ins-stage::after {
  right: 0;
  background: linear-gradient(to left, var(--bg) 0%, transparent 100%);
}

/* Horizontal scroll row */
.ins-scroll {
  display: flex;
  gap: 18px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  padding: 8px clamp(20px,5vw,64px) 16px;
}
.ins-scroll::-webkit-scrollbar { display: none; }

/* ═══════════════════════════════════════════════════
   IMAGE CARD
═══════════════════════════════════════════════════ */
.ins-card {
  position: relative;
  display: block;
  width: 295px; min-width: 295px;
  height: 420px;
  border-radius: 20px;
  overflow: hidden;
  flex-shrink: 0;
  scroll-snap-align: start;
  cursor: default;
  /* entrance */
  opacity: 0; transform: translateY(24px);
  transition: opacity .65s var(--eas), transform .65s var(--eas);
}
.ins-card.ins-in { opacity: 1; transform: translateY(0); }

/* Linked cards get pointer + focus ring */
a.ins-card { cursor: pointer; }
a.ins-card:focus-visible {
  outline: 2px solid var(--g);
  outline-offset: 3px;
}

/* ── Card visual background (gradient theme OR photo) */
.ins-card-bg {
  position: absolute; inset: 0;
  background-size: cover;        /* used when a photo is set  */
  background-position: center;   /* keeps focal point centred */
  background-repeat: no-repeat;
  transition: transform .55s ease;
}
.ins-card:hover .ins-card-bg { transform: scale(1.07); }

/* Card colour themes — assigned by JS as ins-theme-1…5,
   cycling automatically for any number of cards.
   A photo (inline background-image) simply paints on top. */
.ins-theme-1 {
  background-image:
    radial-gradient(ellipse 70% 60% at 25% 35%, rgba(64,120,240,.5) 0%, transparent 58%),
    radial-gradient(ellipse 50% 50% at 78% 72%, rgba(120,60,220,.4) 0%, transparent 55%),
    radial-gradient(ellipse 40% 40% at 55% 10%, rgba(40,180,200,.22) 0%, transparent 50%);
  background-color: #050a1e;
}
.ins-theme-2 {
  background-image:
    radial-gradient(ellipse 65% 55% at 30% 40%, rgba(40,190,120,.45) 0%, transparent 58%),
    radial-gradient(ellipse 48% 48% at 72% 68%, rgba(40,120,180,.35) 0%, transparent 55%),
    radial-gradient(ellipse 35% 35% at 60% 15%, rgba(80,220,160,.18) 0%, transparent 50%);
  background-color: #040f0a;
}
.ins-theme-3 {
  background-image:
    radial-gradient(ellipse 65% 55% at 38% 42%, rgba(212,168,67,.42) 0%, transparent 58%),
    radial-gradient(ellipse 48% 45% at 72% 28%, rgba(180,100,40,.3) 0%, transparent 55%),
    radial-gradient(ellipse 35% 35% at 20% 75%, rgba(240,180,80,.15) 0%, transparent 50%);
  background-color: #120a02;
}
.ins-theme-4 {
  background-image:
    radial-gradient(ellipse 62% 55% at 32% 42%, rgba(140,60,220,.45) 0%, transparent 58%),
    radial-gradient(ellipse 50% 46% at 72% 68%, rgba(60,140,240,.35) 0%, transparent 55%),
    radial-gradient(ellipse 38% 38% at 60% 10%, rgba(200,80,180,.2) 0%, transparent 50%);
  background-color: #0a0514;
}
.ins-theme-5 {
  background-image:
    radial-gradient(ellipse 65% 55% at 28% 50%, rgba(40,160,210,.45) 0%, transparent 58%),
    radial-gradient(ellipse 48% 46% at 72% 28%, rgba(80,200,180,.28) 0%, transparent 52%),
    radial-gradient(ellipse 38% 38% at 55% 80%, rgba(40,120,200,.2) 0%, transparent 50%);
  background-color: #030d14;
}

/* Scan-line texture on card backgrounds */
.ins-card-bg::after {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,0,0,.025) 0px,
    rgba(0,0,0,.025) 1px,
    transparent 1px,
    transparent 4px
  );
  pointer-events: none;
}

/* Bottom gradient overlay for text legibility
   (kept for photos too — guarantees readable titles) */
.ins-card-ov {
  position: absolute; inset: 0;
  background: linear-gradient(
    to top,
    rgba(0,0,0,.96) 0%,
    rgba(0,0,0,.75) 28%,
    rgba(0,0,0,.30) 56%,
    rgba(0,0,0,.08) 80%,
    transparent 100%
  );
}

/* Thin gold top accent line */
.ins-card-bar {
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--g), var(--gl) 55%, transparent);
  opacity: 0; transition: opacity .3s;
}
.ins-card:hover .ins-card-bar { opacity: 1; }

/* ── Card content — pinned to bottom */
.ins-card-body {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 22px 22px 22px;
  z-index: 2;
}

.ins-card-title {
  font-size: 17px !important; font-weight: 900 !important;
  color: var(--w) !important; line-height: 1.25;
  letter-spacing: -.015em; margin-bottom: 12px;
  transition: color .22s;
}
.ins-card:hover .ins-card-title { color: var(--gl) !important; }

.ins-card-cat {
  display: flex; align-items: center; gap: 7px;
  font-size: 9.5px !important; font-weight: 700 !important;
  letter-spacing: .16em !important; text-transform: uppercase;
  color: rgba(255,255,255,.62) !important;
}
.ins-card-dot {
  width: 7px; height: 7px; border-radius: 50%;
  flex-shrink: 0;
  box-shadow: 0 0 6px currentColor;
}
.ins-card-dot--article  { background: var(--g);  color: var(--g); }
.ins-card-dot--research { background: #5ac89a;   color: #5ac89a; }
.ins-card-dot--paper    { background: #9070d4;   color: #9070d4; }

/* ── Hover: read link appears (only on linked cards) ── */
.ins-card-read {
  position: absolute; top: 20px; right: 20px; z-index: 2;
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px !important; font-weight: 700 !important;
  color: var(--g) !important; letter-spacing: .06em;
  background: rgba(0,0,0,.6);
  border: 1px solid rgba(212,168,67,.35);
  border-radius: 40px; padding: 6px 12px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  opacity: 0; transform: translateY(-6px);
  transition: opacity .25s var(--eas), transform .25s var(--eas);
}
.ins-card:hover .ins-card-read { opacity: 1; transform: translateY(0); }

/* ═══════════════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════════════ */
@media (max-width: 768px) {
  .ins-hdr-r .ins-nav-btn { display: none; }
  .ins-card { width: 260px; min-width: 260px; height: 380px; }
}
@media (max-width: 480px) {
  .ins-card { width: 78vw; min-width: 78vw; height: 340px; }
}
@media (prefers-reduced-motion: reduce) {
  #insSec *, #insSec *::before, #insSec *::after {
    animation: none !important; transition: none !important;
  }
  .ins-card { opacity: 1 !important; transform: none !important; }
  .ins-card-bg { transform: none !important; }
}
</style>

<div class="ins-wrap">

  <!-- Header -->
  <div class="ins-hdr">
    <div class="ins-hdr-l">
      <div class="ins-eye"><span class="ins-eye-dot"></span>Insights</div>
      <h2 class="ins-h2">Latest insights</h2>
    </div>
    <div class="ins-hdr-r">
      <button class="ins-nav-btn" id="insPrev" aria-label="Previous">&#8592;</button>
      <button class="ins-nav-btn" id="insNext" aria-label="Next">&#8594;</button>
      <a href="#" class="ins-view-all">View all</a>
    </div>
  </div>

  <!-- Scroll stage — cards are built by JS from the CARDS config -->
  <div class="ins-stage">
    <div class="ins-scroll" id="insScroll"></div>
  </div>

</div>
</section>

<script>
((() => {
  'use strict';

  /* ═══════════════════════════════════════════════════
     ★ CARD CONFIG — the only place you edit ★

     Per card:
       title  : headline text
       type   : 'article' | 'research' | 'paper'
       label  : category text shown under the title
       image  : '' = gradient background (current design)
                'https://your-site.com/wp-content/uploads/photo.jpg'
                = photo background (upload to WP media library
                  and paste the file URL here)
       url    : '' = card not clickable
                '/insights/my-post' or full https://… URL
                = the whole card becomes a link
       newTab : true = link opens in a new tab (optional)

     Add or remove cards freely — gradient themes cycle
     automatically for any number of cards.
  ═══════════════════════════════════════════════════ */
  var CARDS = [
    {
      title:  'How GCC enterprises are closing the AI skills gap',
      type:   'article',
      label:  'Article',
      image:  '',
      url:    ''
    },
    {
      title:  'Why the 2:1 CV ratio matters more than volume hiring',
      type:   'article',
      label:  'Article',
      image:  '',
      url:    ''
    },
    {
      title:  'SAP talent in the GCC: what the market tells us',
      type:   'research',
      label:  'Research',
      image:  '',
      url:    ''
    },
    {
      title:  'Building a GCC engineering centre: the first 90 days',
      type:   'paper',
      label:  'White Paper',
      image:  '',
      url:    ''
    },
    {
      title:  'Open seats, stalled roadmaps: the CIO\'s hiring problem',
      type:   'article',
      label:  'Article',
      image:  '',
      url:    ''
    }
  ];

  /* ═══════════════════════════════════════════════════
     BUILD CARDS (no need to edit below this line)
  ═══════════════════════════════════════════════════ */
  var THEMES  = 5;                       /* gradient themes cycle 1..5 */
  var scroll  = document.getElementById('insScroll');

  function esc(s) {                      /* escape text for safe HTML */
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  CARDS.forEach((c, i) => {
    /* Linked card = <a>, plain card = <div> */
    var card = document.createElement(c.url ? 'a' : 'div');
    card.className = 'ins-card';
    card.setAttribute('data-delay', (i * 0.08).toFixed(2));
    if (c.url) {
      card.href = c.url;
      card.setAttribute('aria-label', c.title);
      if (c.newTab) {
        card.target = '_blank';
        card.rel    = 'noopener noreferrer';
      }
    }

    /* Background: gradient theme, photo painted on top if set */
    var themeClass = 'ins-theme-' + ((i % THEMES) + 1);
    var bgStyle    = c.image
      ? ' style="background-image:url(\'' + c.image.replace(/'/g, '%27') + '\')"'
      : '';

    card.innerHTML =
      '<div class="ins-card-bg ' + themeClass + '"' + bgStyle + '></div>' +
      '<div class="ins-card-ov"></div>' +
      '<div class="ins-card-bar"></div>' +
      (c.url ? '<div class="ins-card-read">Read &#8594;</div>' : '') +
      '<div class="ins-card-body">' +
        '<h3 class="ins-card-title">' + esc(c.title) + '</h3>' +
        '<div class="ins-card-cat">' +
          '<span class="ins-card-dot ins-card-dot--' + esc(c.type) + '"></span>' +
          esc(c.label) +
        '</div>' +
      '</div>';

    scroll.appendChild(card);
  });

  var cards  = Array.prototype.slice.call(
    document.querySelectorAll('#insSec .ins-card')
  );
  var CARD_W = 295 + 18; /* card width + gap */

  /* ── Nav buttons ──────────────────────────────── */
  document.getElementById('insPrev').onclick = () => {
    scroll.scrollBy({ left: -CARD_W * 2, behavior: 'smooth' });
  };
  document.getElementById('insNext').onclick = () => {
    scroll.scrollBy({ left:  CARD_W * 2, behavior: 'smooth' });
  };

  /* ── Scroll reveal ────────────────────────────── */
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        var el    = entry.target;
        var delay = parseFloat(el.getAttribute('data-delay') || '0') * 1000;
        setTimeout(() => { el.classList.add('ins-in'); }, delay);
        io.unobserve(el);
      });
    }, { threshold: 0.1 });
    cards.forEach((c) => { io.observe(c); });
  } else {
    cards.forEach((c) => { c.classList.add('ins-in'); });
  }

})());
</script>
