# The published order of the case studies. One editorial decision, one file.
#
# The homepage rail takes the first HOMEPAGE_CASE_STUDY_COUNT of these and
# /case-studies lists all of them in this order. Reranking is moving a line.
#
# This ships carrying the order the `featured` integers already encoded, so the
# merge changes no positions. Sumeet reranks after.
#
# Two rules, both enforced in src/lib/case-study-order.ts:
#   - A slug named here that resolves to no case study FAILS THE BUILD. Delete a
#     study and delete its line in the same commit. An order file that skips
#     silently keeps working while describing a site that no longer exists.
#   - A published study not named here still publishes; it appends behind these
#     in date order, newest first. Adding a study never requires editing this.
#
# Round 7 note for the evidence audit at §4.1 and §7: the client column below is
# a comment, not data, and it is the duplication the audit exists to resolve.
# Four Majid Al Futtaim entries, four Alshaya, two Chalhoub, and one reading
