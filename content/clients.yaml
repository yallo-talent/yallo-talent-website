# Client register — canon §9 and combined relay §9.
#
# Two groups, never merged into one strip. Only the names below appear on the
# site; the supplied logo pack contains around forty more and they are NOT
# current trading relationships, so they are not shipped.
#
# `consentOnFile: false` means the entry renders nowhere — the loader filters at
# read time and every consumer must respect that filter.
#
# If a name has no file, omit `logo` and it renders as a set wordmark; never
# substitute a similar logo. See the header of scripts/build-logos.mjs for the
# provenance of the marks that exist.
#
# Radwell was retired on 6 August 2026 under round 17 §2.4 and RESTORED the same
# day: the premise was wrong. `assets/client-logos/Radwell.png` had been in the
# supplied pack all along; only the BUILT file was missing, because the slug was
# commented out of build-logos.mjs. Sumeet caught it. It now keys through the same
# gate as every other mark and passes at 0.0% perimeter ink.
#
# Wickes ships as a mark too, from Sumeet's Wickes-new.png. Both Wickes sources
# are shield-with-knockout-text lockups, which the old single-threshold key
# silhouetted as the SHIELD; the polarity key reads the letters instead.
enterprise:
  - name: Alshaya Group
    logo: /logos/clients/alshaya.png
    consentOnFile: true
  - name: Landmark Group
    logo: /logos/clients/landmark-group.png
    consentOnFile: true
