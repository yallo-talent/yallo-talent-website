name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm biome check .

      - name: Types
        run: pnpm tsc --noEmit

      # Canon §7. Banned for commercial reasons, not stylistic ones — "GCC"
      # collides with Global Capability Centre in Yallo's own India business.
      - name: Terminology
        run: pnpm check:terms

      # Both themes must pass WCAG 2.2 AA independently. Fails on any miss.
      - name: Contrast
        run: pnpm check:contrast

      # Stops one taxonomy's names resolving into another's, and a copy of the
      # label map surviving outside the index. Round 10: proved to fail by
      # writing "Data & AI" into a discipline data file and watching it flag
      # the exact line, then reverting.
      - name: Taxonomy
        run: pnpm check:taxonomy

      # An excerpt is compression of the body, never a new fact. Round 10:
      # --selftest proves the gate catches a fixture excerpt naming a client
      # its body never mentions, run here before the real corpus so a broken
      # checker cannot pass by going blind.
      - name: Case-study excerpts (self-test, then the real corpus)
        run: |
          node scripts/check-case-study-excerpts.mjs --selftest
          pnpm check:cs-excerpts

      # Relay v2.0 §3.1. Nothing renders below 12px, and uppercase mono labels
      # carry at least 0.12em tracking. The 11px eyebrow was the case flagged
      # as unreadable, and it appeared on every page.
      - name: Type scale
        run: pnpm check:type

      - name: Build
        run: pnpm build

      # robots.ts branches on NEXT_PUBLIC_SITE_URL, which is inlined at build
      # time, so this build is the non-production branch — the posture every
      # preview and the talent.yallo.co placeholder ship. It had never been
      # asserted either: reviewed in source, never compared against emitted
      # output. Reads the built artefact, so it costs nothing beyond the build
      # already above it. The production branch cannot be asserted from this
      # build at all and has its own workflow, robots-policy.yml.
      - name: Robots policy (non-production branch, as emitted)
        run: pnpm check:robots

      - run: pnpm exec playwright install --with-deps chromium

      # Round 7 found Tailwind preflight had killed <ul> markers on every
      # case-study movement; e2e/case-study-movements.spec.ts asserts real
      # <ul>/<li> markup and a rendered ::before marker across all ten
      # published studies, and was proven to fail red before that fix landed.
      # It ran under this step's name before (bare "pnpm test"), which is
      # exactly how a gate keeps passing after the thing it protects regresses
      # — nobody reads a generic label and connects it to a specific fix six
      # months on. Named here so it stays a deliberate CI presence, not an
      # incidental one. Also runs smoke.spec.ts and dead-hrefs.spec.ts.
      - name: Playwright (case-study markers, smoke, dead hrefs)
        run: pnpm test

      # Round 8. The same preflight class of defect on /insights/[slug]:
      # `.prose` (headings, list markers, blockquote, hr, table borders) was
      # written but never applied to the MDXRemote render, so every insight
      # article's markdown body rendered with no visual hierarchy at all. No
      # article is published right now (check:gate-coverage already reports
      # /insights/[slug] as a unit with no live URL), so there is no route for
      # a browser test to visit yet — this is the static floor until one
      # exists: it fails if `.prose` stops being applied, or if its marker,
      # heading, blockquote, hr or table rules are removed.
      - name: Prose rules wired and complete (insights markdown)
        run: pnpm check:prose

      # Asserts what silently regresses: real metric values in the
      # server-rendered HTML rather than zeros, no banned term on the page, no
      # horizontal overflow at 360px, no unrendered image. Runs against the
      # production build because dev-mode image optimisation skews the timings.
      - name: Visual and served-markup assertions
        run: |
          PORT=3100 pnpm start &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://localhost:3100 && break
            sleep 1
          done
          PORT=3100 pnpm check:visual

      # Canon's accessibility floor is WCAG 2.2 AA on every surface in BOTH
      # themes independently, so axe runs each route twice per width. The token
      # contrast gate cannot see pairs that are only formed at render — an
      # ink-on-gold button, a light-theme eyebrow on a permanently dark ground —
      # and this is what catches those. Lighthouse is deliberately absent: it
      # needs the real host.
      - name: Accessibility (axe, both themes, 1280 and 360)
        run: CAPTURE_BASE=http://localhost:3100 pnpm check:a11y --base http://localhost:3100

      # A4's type roles and canon §5's weights, judged on what the browser
      # PAINTS. check:type reads source and cannot see resolution: which real
      # face a declared weight lands on, whether 13px text is mono when the
      # family is inherited, or whether uppercase applies when text-transform
      # is inherited. That last one is why this exists as a gate rather than a
      # one-off fix — .expertiseHiddenCount rendered uppercase mono at 0.100em
      # against A4's 0.12em floor and check:type reported CLEAN, because the
      # uppercase came from a parent. Two critique passes each fixed the sites
      # they happened to sample and the next found the same defect in eleven
      # components they had not.
      - name: Rendered type (weights, A4 roles, tracking)
        run: node scripts/check-rendered-type.mjs http://localhost:3100

      # Canon §5 requires prefers-reduced-motion honoured for EVERY animation.
      # Neither of the other gates can see this: the token gate reads CSS, and
      # axe does not evaluate motion. Two things had to be true and neither was
      # — Framer defaults to reducedMotion "never", and the universal
      # reduced-motion reset in globals.css lost on specificity to every
      # component class declaring a `transition` shorthand.
      - name: Reduced motion (Framer + CSS, with a motion-allowed control)
        run: PORT=3100 pnpm check:motion

      # The four classes no other gate can see, and every one of them caught a
      # real defect: SC 1.4.13 dismissibility (the mega panels opened on focus
      # and Escape did nothing, so the primary CTA was 33 tab stops away),
      # fixed-overlay occlusion (two sticky surfaces each reduced a live link to
      # zero clickable area), section heading level versus role (axe's
      # heading-order passes 2->3, but AT nests the section as a child), and
      # canon §2's copy tell. Four rounds of critique found the design system
      # holding while every new P1 arrived in an uninstrumented category; this is
      # what closes those four.
      - name: Interaction (dismissible, occlusion, outline, repetition)
        run: node scripts/check-interaction.mjs http://localhost:3100

      # SC 1.4.10 Reflow at the 360px floor, every route, both registers.
      # capture-home.mjs asserted this for the homepage only — 1 of ~20 routes —
      # and a decorative petal at right:-34px pushed /ai-talent to 374px in both
      # themes with nothing in CI able to see it.
      - name: Reflow (360px, every route, both registers)
        run: PORT=3100 pnpm check:reflow

      # Canon §2: capital Y only, judged on what the browser renders — a
      # text-transform or a literal string can both produce "YALLO" and
      # neither is visible to a static grep. Also proves every internal link
      # it walks resolves. Round 10: proved to fail by setting a literal
      # "YALLO" in rendered copy and watching it name the element, then
      # reverting.
      - name: Yallo casing (rendered) and internal link resolution
        run: BASE_URL=http://localhost:3100 pnpm check:yallo-case

      # §3.4: the estate band's role-to-tool interaction must be keyboard
      # reachable, paired with a non-motion cue, and never hide a fact at
      # rest. Round 10: proved to fail by removing the data-lit wiring and
      # watching keyboard focus light nothing, then reverting.
      - name: Estate band interaction (keyboard, motion-free cue, at-rest completeness)
        run: node scripts/check-estate-interaction.mjs http://localhost:3100

      # Every mark normalised on rendered ink area against its surface's
      # median. Round 10: proved to fail by inflating one asset's declared
      # ink fraction in the manifest and watching the rendered box fall
      # outside tolerance, then reverting.
      - name: Mark scale (rendered ink area against surface median)
        run: node scripts/check-marks.mjs http://localhost:3100

      # The guard on the guards: every rendering unit with a live URL must be
      # visited by at least one enumerating gate, read from each gate's own
      # source list rather than a maintained copy. Round 10: proved to fail by
      # dropping one route from check-reflow's list and watching its shell
      # report zero coverage, then reverting.
      - name: Gate coverage (every rendering unit has an enumerating gate)
        run: node scripts/check-gate-coverage.mjs http://localhost:3100

      # check-yallo-case already proves every internal href eventually
      # resolves, following redirects — a working 301 chain passes it. A hop
      # is a different defect and costs AI retrieval eligibility, not only
      # crawl budget. Round 10: proved to fail by linking to a page carrying
      # a real legacy redirect and watching it name the 308 and its
      # destination, then reverting.
      - name: No internal link resolves through a redirect
        run: node scripts/check-no-redirect-hops.mjs http://localhost:3100

      # Round 17 §2.2: the four published figures never appear without one dated
      # attribution, and every surface carries the SAME one. Proved red on real
      # defects the moment it was written — seven /platforms/* pages were
      # publishing three of the four as first-party claims with no source and no
      # date, from figures TYPED into src/data/platforms/why.ts where the
      # quarterly refresh could never reach them. tsc protects the four templates
      # that take the line as a required prop; this is what protects the next
      # template nobody remembers to add.
      - name: Metrics attribution (one dated line, every publishing page)
        run: node scripts/check-metrics-attribution.mjs http://localhost:3100

      # Round 17 §2.1. The research PDF is generated from the site's own print
      # surface, so it holds no typed figures — but it is COMMITTED, so a changed
      # figure moved every page and left the document behind until somebody
      # remembered `pnpm research:pdf`. Nothing failed. Eleventh instance of a
      # second copy no gate compared, and it is the one asset a stranger hands
      # over an email address for.
      #
      # Not a byte diff: Chromium's PDF output is not reproducible, so comparing
      # bytes fails every run and teaches everyone to skip the gate. The manifest
      # binds the file (size + SHA-256) and the content (a whitespace-collapsed
      # text fingerprint, <script> stripped so the build id does not enter it),
      # and build-research-pdf.mjs writes both from the one run.
      #
      # Proved red three ways, real exit 1 each: a figure changed on the served
      # page with the PDF untouched, the PDF altered without regenerating, and
      # the PDF missing entirely.
      - name: Research PDF agrees with the pages that produced it
        run: node scripts/check-research-pdf.mjs http://localhost:3100

      # Round 17 §2.3. /admin reads every brief and every assistant conversation
      # the site has captured, so six independent things must hold: absent from
      # sitemap.xml, absent from llms.txt, absent from the assistant corpus,
      # disallowed in robots.txt with a noindex header on every response
      # including redirects, linked from no published page, and no admin secret
      # in the client bundle. It also asserts an anonymous request to each pane
      # is redirected rather than served.
      #
      # THE CORPUS ASSERTION IS THE ONE THAT WOULD BE FORGOTTEN. The corpus is
      # generated from src/data/** and content/**, and an assistant that can
      # describe the admin surface — including where to sign in — is the failure
      # mode, not a cosmetic leak.
      #
      # Proved red six ways, real exit 1 each: /admin/ dropped from the robots
      # policy, a corpus source file naming /admin, the hash script's scrypt
      # parameters drifting from the verifier's, a sitemap entry, a homepage link,
      # and — rebuilt for these two — the layout guard removed so panes served to
      # an anonymous request, and the middleware's admin branch removed so the
      # noindex header disappeared.
      #
      # The client-bundle assertion needs the real secrets and says so rather than
      # skipping silently; it is exercised where they exist.
      - name: Admin cockpit isolation (six assertions, one anonymous read)
        run: node scripts/check-admin-isolation.mjs http://localhost:3100

      - name: Upload captures on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-captures
          path: test-results/visual
          if-no-files-found: ignore
