name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm biome check .

      - name: Types
        run: pnpm tsc --noEmit

      # Canon §7. Banned for commercial reasons, not stylistic ones — "GCC"
      # collides with Global Capability Centre in Yallo's own India business.
      - name: Terminology
        run: pnpm check:terms

      # Both themes must pass WCAG 2.2 AA independently. Fails on any miss.
      - name: Contrast
        run: pnpm check:contrast

      # Relay v2.0 §3.1. Nothing renders below 12px, and uppercase mono labels
      # carry at least 0.12em tracking. The 11px eyebrow was the case flagged
      # as unreadable, and it appeared on every page.
      - name: Type scale
        run: pnpm check:type

      - name: Build
        run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium

      - name: Tests
        run: pnpm test

      # Asserts what silently regresses: real metric values in the
      # server-rendered HTML rather than zeros, no banned term on the page, no
      # horizontal overflow at 360px, no unrendered image. Runs against the
      # production build because dev-mode image optimisation skews the timings.
      - name: Visual and served-markup assertions
        run: |
          PORT=3100 pnpm start &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://localhost:3100 && break
            sleep 1
          done
          PORT=3100 pnpm check:visual

      # Canon's accessibility floor is WCAG 2.2 AA on every surface in BOTH
      # themes independently, so axe runs each route twice per width. The token
      # contrast gate cannot see pairs that are only formed at render — an
      # ink-on-gold button, a light-theme eyebrow on a permanently dark ground —
      # and this is what catches those. Lighthouse is deliberately absent: it
      # needs the real host.
      - name: Accessibility (axe, both themes, 1280 and 360)
        run: CAPTURE_BASE=http://localhost:3100 pnpm check:a11y --base http://localhost:3100

      # A4's type roles and canon §5's weights, judged on what the browser
      # PAINTS. check:type reads source and cannot see resolution: which real
      # face a declared weight lands on, whether 13px text is mono when the
      # family is inherited, or whether uppercase applies when text-transform
      # is inherited. That last one is why this exists as a gate rather than a
      # one-off fix — .expertiseHiddenCount rendered uppercase mono at 0.100em
      # against A4's 0.12em floor and check:type reported CLEAN, because the
      # uppercase came from a parent. Two critique passes each fixed the sites
      # they happened to sample and the next found the same defect in eleven
      # components they had not.
      - name: Rendered type (weights, A4 roles, tracking)
        run: node scripts/check-rendered-type.mjs http://localhost:3100

      # Canon §5 requires prefers-reduced-motion honoured for EVERY animation.
      # Neither of the other gates can see this: the token gate reads CSS, and
      # axe does not evaluate motion. Two things had to be true and neither was
      # — Framer defaults to reducedMotion "never", and the universal
      # reduced-motion reset in globals.css lost on specificity to every
      # component class declaring a `transition` shorthand.
      - name: Reduced motion (Framer + CSS, with a motion-allowed control)
        run: PORT=3100 pnpm check:motion

      # The four classes no other gate can see, and every one of them caught a
      # real defect: SC 1.4.13 dismissibility (the mega panels opened on focus
      # and Escape did nothing, so the primary CTA was 33 tab stops away),
      # fixed-overlay occlusion (two sticky surfaces each reduced a live link to
      # zero clickable area), section heading level versus role (axe's
      # heading-order passes 2->3, but AT nests the section as a child), and
      # canon §2's copy tell. Four rounds of critique found the design system
      # holding while every new P1 arrived in an uninstrumented category; this is
      # what closes those four.
      - name: Interaction (dismissible, occlusion, outline, repetition)
        run: node scripts/check-interaction.mjs http://localhost:3100

      # SC 1.4.10 Reflow at the 360px floor, every route, both registers.
      # capture-home.mjs asserted this for the homepage only — 1 of ~20 routes —
      # and a decorative petal at right:-34px pushed /ai-talent to 374px in both
      # themes with nothing in CI able to see it.
      - name: Reflow (360px, every route, both registers)
        run: PORT=3100 pnpm check:reflow

      - name: Upload captures on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-captures
          path: test-results/visual
          if-no-files-found: ignore
