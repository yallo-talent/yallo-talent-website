name: Purge expired assistant transcripts
on:
  schedule:
    # Daily. The retention window itself is src/lib/assistant/retention.json,
    # the one number the purge, /privacy and the in-panel disclosure all
    # derive from — deliberately not restated here, because a period written
    # into a comment is a period that drifts. A schedule this frequent just
    # keeps the lag between expiry and deletion small, not because the table
    # grows fast.
    - cron: "15 3 * * *"
  workflow_dispatch: {}
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:purge-transcripts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
